name: verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run verify-phase.ps1
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "=== Running agent-hq phase verification ==="
          & .\.agents\scripts\verify-phase.ps1
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::verify-phase.ps1 reported failures (exit $code)"
            exit $code
          }
          Write-Host "=== Verification passed ==="

      - name: Upload verify log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-log
          path: |
            .memory/
            CONTEXT-BUFFER.md
          retention-days: 7

  go:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Test
        working-directory: go
        run: go test ./... -count=1
